[package]
name = "raft"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust port of the hashicorp/raft consensus library"
repository = "https://github.com/open_source/raft-rust"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
thiserror = "2"
tracing = "0.1"
bytes = "1"
rand = "0.8"
futures = "0.3"
parking_lot = "0.12"
serde_bytes = "0.11"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
